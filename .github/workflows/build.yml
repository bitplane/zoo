name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions: {}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: macos-arm64
            runner: macos-15
          - target: windows-x86_64
            runner: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: >-
            make
            diffutils
            mingw-w64-ucrt-x86_64-gcc
      - name: Build and test
        if: runner.os != 'Windows'
        run: sh scripts/ci-build.sh '${{ matrix.target }}'
      - name: Build and test
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: sh scripts/ci-build.sh '${{ matrix.target }}'
      - name: Upload release binary
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: zoo-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/**/*.tar.gz
